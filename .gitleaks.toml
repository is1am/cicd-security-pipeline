# Конфигурация Gitleaks: стандартные правила + адресные исключения.
# Синтаксис [allowlist] поддерживается всеми версиями Gitleaks 8.x.
[extend]
useDefault = true

[allowlist]
description = "Данные, а не код"
paths = [
  # JSON-отчёты сканеров и API-тестов: примеры ключей и JWT из описаний CVE,
  # токены тестового стенда (секрет стенда существует только во время прогона)
  '''^reports/''',
  # Postman-коллекция: заведомо поддельный JWT для негативного теста
  '''^postman/RBAC_PR5\.postman_collection\.json$''',
]
